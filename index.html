<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Osmond 英文單字遊戲</title>
<style>
  :root{
    --pink:#ff6fa5; --orange:#ff9f43; --yellow:#ffd93d; --green:#6bcB77;
    --blue:#4d96ff; --purple:#9b5de5; --bg:#fef6f0; --ink:#3a3a3a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; min-height:100vh; background:linear-gradient(180deg,#fff9f0,#ffe9d6);
    font-family:'Comic Sans MS','Chalkboard SE','Segoe UI',sans-serif;
    color:var(--ink); display:flex; flex-direction:column; align-items:center;
    overflow-x:hidden;
  }
  .screen{width:100%; max-width:900px; padding:20px; display:flex; flex-direction:column; align-items:center; min-height:100vh;}
  h1{font-size:2.2rem; margin:10px 0; text-align:center;}
  h2{font-size:1.6rem; margin:8px 0; text-align:center;}
  .stars-total{font-size:1.3rem; background:#fff; border-radius:30px; padding:8px 22px; box-shadow:0 4px 0 #ddd; margin-bottom:20px;}
  .grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:18px; width:100%; margin-top:10px;}
  .card-btn{
    border:none; border-radius:24px; padding:26px 14px; font-size:1.3rem; font-weight:bold;
    color:#fff; cursor:pointer; box-shadow:0 6px 0 rgba(0,0,0,0.15); transition:transform .08s;
    display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  .card-btn:active{transform:translateY(6px); box-shadow:0 0 0 rgba(0,0,0,0.15);}
  .card-btn .emoji{font-size:2.6rem;}
  .lesson-stars{background:rgba(255,255,255,0.3); border-radius:14px; padding:3px 12px; font-size:0.95rem; margin-top:2px;}
  .l0{background:var(--blue);} .l1{background:var(--pink);} .l2{background:var(--green);}
  .l3{background:var(--orange);} .l4{background:var(--purple);}
  .dayA{background:#4d96ff;} .dayB{background:#6bcB77;} .dayC{background:#ff9f43;}
  .dayD{background:#ff6fa5;} .dayE{background:#f7c948; color:#5a3d00;}
  .back-btn{
    align-self:flex-start; border:none; background:#fff; border-radius:16px; padding:10px 18px;
    font-size:1.1rem; box-shadow:0 4px 0 #ddd; cursor:pointer; margin-bottom:10px;
  }
  .practice-wrap{flex:1; width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .progress{display:flex; gap:6px; margin-bottom:24px; flex-wrap:wrap; justify-content:center;}
  .dot{width:14px; height:14px; border-radius:50%; background:#e0d5c8;}
  .dot.done{background:var(--green);}
  .dot.current{background:var(--orange); transform:scale(1.3);}
  .flashcard{
    background:#fff; border-radius:32px; box-shadow:0 10px 0 #e8d9c8; padding:40px 30px;
    width:100%; max-width:600px; text-align:center; min-height:320px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
  }
  .flashcard .emoji-big{font-size:6rem; line-height:1;}
  .word-en{font-size:3rem; font-weight:bold; color:var(--pink); word-break:break-word;}
  .word-zh{font-size:1.4rem; color:#888;}
  .sentence-en{font-size:2rem; font-weight:bold; color:var(--blue); line-height:1.4;}
  .tag{font-size:1rem; background:#ffe9d6; padding:4px 14px; border-radius:20px; color:#a15c00;}
  .btn-row{display:flex; gap:16px; margin-top:26px; flex-wrap:wrap; justify-content:center;}
  .round-btn{
    border:none; border-radius:50%; width:78px; height:78px; font-size:2rem; cursor:pointer;
    box-shadow:0 6px 0 rgba(0,0,0,0.15); color:#fff;
  }
  .round-btn:active{transform:translateY(6px); box-shadow:none;}
  .speak-btn{background:var(--blue);}
  .prev-btn{background:#bbb;}
  .next-btn{background:var(--green);}
  .end-wrap{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:16px;}
  .end-stars{font-size:3.5rem;}
  .big-btn{
    border:none; border-radius:20px; padding:16px 30px; font-size:1.2rem; font-weight:bold; color:#fff;
    cursor:pointer; box-shadow:0 6px 0 rgba(0,0,0,0.15); margin:6px;
  }
  .game-btn{
    border:none; border-radius:26px; padding:20px 24px; font-size:1.4rem; font-weight:bold; color:#fff;
    background:linear-gradient(135deg,var(--purple),var(--pink)); cursor:pointer;
    box-shadow:0 6px 0 rgba(0,0,0,0.15); margin-top:24px; width:100%; max-width:520px;
  }
  .game-btn:active{transform:translateY(6px); box-shadow:none;}
  .confetti{position:fixed; top:-20px; font-size:1.8rem; animation:fall linear forwards; pointer-events:none;}
  @keyframes fall{ to{ transform:translateY(110vh) rotate(360deg); opacity:0.3; } }
  .hint{color:#999; font-size:1rem; margin-top:10px;}
  .score-badge{position:fixed; top:14px; right:14px; background:#fff; border-radius:20px; padding:8px 16px; box-shadow:0 4px 0 #ddd; font-weight:bold; font-size:1.1rem;}
  .big-speaker{
    width:110px; height:110px; border-radius:50%; background:var(--blue); color:#fff; font-size:3rem;
    border:none; box-shadow:0 8px 0 rgba(0,0,0,0.15); cursor:pointer; margin:10px 0 24px;
  }
  .big-speaker:active{transform:translateY(8px); box-shadow:none;}
  .choice-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px; width:100%; max-width:520px;}
  .choice-btn{
    background:#fff; border:4px solid #eee; border-radius:20px; padding:22px 10px; font-size:1.5rem;
    font-weight:bold; cursor:pointer; box-shadow:0 6px 0 #ddd; display:flex; flex-direction:column;
    align-items:center; gap:8px; color:var(--ink);
  }
  .choice-btn:active{transform:translateY(4px); box-shadow:0 2px 0 #ddd;}
  .choice-btn.correct{background:#d9f7be; border-color:var(--green); animation:pop .3s;}
  .choice-btn.wrong{background:#ffd6d6; border-color:#ff6b6b; animation:shake .4s;}
  .choice-btn.text-only{font-size:1.6rem; padding:18px 10px;}
  .choice-btn.icon-only{padding:10px;}
  .choice-btn.icon-only .game-emoji{font-size:2.8rem;}
  .choice-btn.icon-only .svg-icon svg{width:56px; height:56px;}
  .choice-btn.disabled-choice{opacity:0.35;}
  .game-section{width:100%; max-width:520px; margin-bottom:16px;}
  .section-label{font-weight:bold; color:#a15c00; margin-bottom:8px; font-size:1.1rem;}
  .sentence-build-row{
    min-height:64px; width:100%; max-width:560px; background:#fff; border:3px dashed #e0d5c8; border-radius:18px;
    padding:12px 16px; display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:20px;
  }
  .placed-token{
    background:#d9f7be; border:3px solid var(--green); border-radius:14px; padding:8px 16px;
    font-size:1.4rem; font-weight:bold; color:var(--ink);
  }
  .build-placeholder{color:#ccc; font-size:1.2rem;}
  .tile-bank{display:flex; flex-wrap:wrap; justify-content:center; gap:12px; width:100%; max-width:560px;}
  .choice-btn.sentence-tile{font-size:1.4rem; padding:14px 22px; font-weight:bold;}
  .sentence-choice-list{display:flex; flex-direction:column; gap:14px; width:100%; max-width:560px;}
  .choice-btn.sentence-choice{font-size:1.3rem; padding:20px 18px; text-align:left; display:block;}
  .qa-question-box{
    background:#eaf3ff; border:3px solid var(--blue); border-radius:18px; padding:18px 24px;
    font-size:1.5rem; font-weight:bold; color:var(--ink); width:100%; max-width:560px;
    text-align:center; margin-bottom:20px;
  }
  .game-emoji{font-size:2.6rem;}
  .svg-icon{display:inline-flex;}
  .svg-icon svg{width:100%; height:100%;}
  .emoji-big.svg-icon svg{width:110px; height:110px;}
  .img-icon{display:inline-flex; border-radius:16px; overflow:hidden; box-shadow:0 3px 0 rgba(0,0,0,0.1);}
  .img-icon img{width:100%; height:100%; object-fit:cover; display:block;}
  .emoji-big.img-icon{width:140px; height:140px;}
  .game-emoji.img-icon{width:90px; height:90px;}
  .choice-btn.icon-only .img-icon{width:80px; height:80px;}
  @keyframes pop{ 0%{transform:scale(1);} 50%{transform:scale(1.1);} 100%{transform:scale(1);} }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-8px);} 75%{transform:translateX(8px);} }
</style>
</head>

function iconHTML(word, cls){
  if(word.img) return `<span class="${cls} img-icon"><img src="${word.img}" alt="${word.en}"></span>`;
  if(word.emoji) return `<span class="${cls}">${word.emoji}</span>`;
  if(word.icon && ICONS[word.icon]) return `<span class="${cls} svg-icon">${ICONS[word.icon]}</span>`;
  return '';
}

/* ---------- 星星儲存（精熟制：每個單字最多2顆＝字卡+圖卡，每個句子最多1顆，不會無限累加） ---------- */
function getMasteryMap(){
  try{ return JSON.parse(localStorage.getItem('osmond_mastery')||'{}'); }
  catch(e){ return {}; }
}
function getLessonMastery(idx){
  const m = getMasteryMap();
  return m[idx] || { word:{}, picture:{}, sentence:{}, qa:{} };
}
function markMastered(idx, kind, key){
  const m = getMasteryMap();
  if(!m[idx]) m[idx] = { word:{}, picture:{}, sentence:{}, qa:{} };
  if(!m[idx][kind]) m[idx][kind] = {};
  if(m[idx][kind][key]) return false;
  m[idx][kind][key] = true;
  localStorage.setItem('osmond_mastery', JSON.stringify(m));
  return true;
}
function getLessonStars(idx){
  const lm = getLessonMastery(idx);
  return Object.keys(lm.word).length + Object.keys(lm.picture).length + Object.keys(lm.sentence).length + Object.keys(lm.qa||{}).length;
}
function getLessonMaxStars(idx){
  return buildLessonWordPool(idx).length * 2 + buildLessonSentencePool(idx).length + buildQAPairs(idx,'ALL').length;
}
function getTotalStars(){
  return LESSONS.reduce((sum,_,i)=>sum+getLessonStars(i), 0);
}
function getTotalMaxStars(){
  return LESSONS.reduce((sum,_,i)=>sum+getLessonMaxStars(i), 0);
}

/* ---------- TTS ---------- */
const WORD_RATE = 0.85;
const SENTENCE_RATE = 0.425;
let voices = [];
function loadVoices(){ voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; }
if('speechSynthesis' in window){
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}
function speak(text, rate){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = rate || WORD_RATE;
  const v = voices.find(v=>v.lang && v.lang.startsWith('en'));
  if(v) u.voice = v;
  speechSynthesis.speak(u);
}

/* ---------- confetti ---------- */
function confettiBurst(){
  const emojis = ['⭐','🎉','✨','🌟','🎈'];
  for(let i=0;i<24;i++){
    const el = document.createElement('div');
    el.className='confetti';
    el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    el.style.left = Math.random()*100+'vw';
    el.style.animationDuration = (2+Math.random()*1.5)+'s';
    el.style.fontSize = (1.2+Math.random()*1.4)+'rem';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 3800);
  }
}

/* ---------- 狀態機 ---------- */
let state = { screen:'home', lessonIdx:0, dayKey:null, items:[], pos:0, game:null };

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function buildDayItems(lessonIdx, dayKey){
  const lesson = LESSONS[lessonIdx];
  if(dayKey === 'E'){
    // 複習日：整合週一到週四的所有單字與句子
    let words=[], sentences=[];
    DAY_KEYS.forEach(k=>{
      words = words.concat(lesson.days[k].words);
      sentences = sentences.concat(lesson.days[k].sentences);
    });
    return { words, sentences };
  }
  const d = lesson.days[dayKey];
  return { words: d.words, sentences: d.sentences };
}

function buildLessonWordPool(lessonIdx){
  let words=[];
  DAY_KEYS.forEach(k=>{ words = words.concat(LESSONS[lessonIdx].days[k].words); });
  return words;
}

function buildLessonSentencePool(lessonIdx){
  let sentences=[];
  DAY_KEYS.forEach(k=>{ sentences = sentences.concat(LESSONS[lessonIdx].days[k].sentences); });
  return sentences;
}

function buildWordPool(lessonIdx, dayKey){
  if(dayKey === 'ALL') return buildLessonWordPool(lessonIdx);
  return LESSONS[lessonIdx].days[dayKey].words;
}

function buildSentencePool(lessonIdx, dayKey){
  if(dayKey === 'ALL') return buildLessonSentencePool(lessonIdx);
  return LESSONS[lessonIdx].days[dayKey].sentences;
}

function buildDayQAPairs(lessonIdx, dayKey){
  const sentences = LESSONS[lessonIdx].days[dayKey].sentences;
  const pairs = [];
  for(let i=0; i+1<sentences.length; i+=2){
    pairs.push({q:sentences[i], a:sentences[i+1]});
  }
  return pairs;
}
function buildQAPairs(lessonIdx, dayKey){
  if(dayKey === 'ALL'){
    let pairs = [];
    DAY_KEYS.forEach(k=>{ pairs = pairs.concat(buildDayQAPairs(lessonIdx, k)); });
    return pairs;
  }
  return buildDayQAPairs(lessonIdx, dayKey);
}
function buildOtherLessonAnswers(excludeLessonIdx){
  let answers = [];
  LESSONS.forEach((lesson,i)=>{
    if(i === excludeLessonIdx) return;
    DAY_KEYS.forEach(k=>{
      buildDayQAPairs(i,k).forEach(p=>answers.push(p.a));
    });
  });
  return answers;
}

function goHome(){ state = {screen:'home', lessonIdx:0, dayKey:null, items:[], pos:0, game:null}; render(); }
function goLesson(idx){ state.screen='lesson'; state.lessonIdx=idx; render(); }
function goReviewMenu(){ state.screen='reviewMenu'; render(); }
function goGameDays(){ state.screen='gameDays'; render(); }

/* ---------- 複習卡片（純聽讀，不計星星） ---------- */
function goReview(dayKey){
  const data = buildDayItems(state.lessonIdx, dayKey);
  const items = [
    ...data.words.map(w=>({type:'word', ...w})),
    ...data.sentences.map(s=>({type:'sentence', en:s}))
  ];
  state.screen='review'; state.dayKey=dayKey; state.items=items; state.pos=0;
  render();
}
function nextReview(){
  if(state.pos < state.items.length-1){ state.pos += 1; render(); }
  else { state.screen='reviewEnd'; render(); }
}
function prevReview(){
  if(state.pos>0){ state.pos-=1; render(); }
}

/* ---------- 聽力遊戲（單字配對＋句子排序合併，答對才給星星） ---------- */
function goGame(dayKey){
  dayKey = dayKey || 'ALL';
  const wordPool = buildWordPool(state.lessonIdx, dayKey);
  const sentencePool = buildSentencePool(state.lessonIdx, dayKey);
  const qaPairs = buildQAPairs(state.lessonIdx, dayKey);
  const otherAnswers = buildOtherLessonAnswers(state.lessonIdx);
  const wordRoundSize = Math.min(10, wordPool.length);
  const sentenceRoundSize = Math.min(8, sentencePool.length);
  const wordItems = shuffle(wordPool).slice(0, wordRoundSize).map(w=>({kind:'word', data:w}));
  const sentenceItems = shuffle(sentencePool).slice(0, sentenceRoundSize).flatMap(s=>[
    {kind:'sentence', subKind:'choice', data:s},
    {kind:'sentence', subKind:'order', data:s}
  ]);
  const qaItems = shuffle(qaPairs).map(p=>({kind:'qa', data:p}));
  const order = shuffle([...wordItems, ...sentenceItems, ...qaItems]);
  state.screen = 'game';
  state.game = { dayKey, wordPool, sentencePool, otherAnswers, order, qIndex:0, sessionStars:0 };
  setupQuestion();
  render();
  speakCurrentQuestion();
}
function speakCurrentQuestion(){
  const g = state.game;
  const item = g.order[g.qIndex];
  if(item.kind==='word') setTimeout(()=>speak(item.data.en), 300);
  else if(item.kind==='qa') setTimeout(()=>speak(item.data.q, SENTENCE_RATE), 300);
  else setTimeout(()=>speak(item.data, SENTENCE_RATE), 300);
}
function setupQuestion(){
  const g = state.game;
  const item = g.order[g.qIndex];
  if(item.kind === 'word'){
    const current = item.data;
    const distractors = shuffle(g.wordPool.filter(w=>w.en!==current.en)).slice(0,3);
    const optionSet = [current, ...distractors];
    g.current = current;
    g.wordChoices = shuffle(optionSet);
    g.pictureChoices = shuffle(optionSet);
    g.wordDone = false;
    g.pictureDone = false;
    g.wordLocked = false;
    g.pictureLocked = false;
    g.wordMistake = false;
    g.pictureMistake = false;
  } else if(item.kind === 'qa'){
    const pair = item.data;
    const distractors = shuffle(g.otherAnswers).slice(0,3);
    g.current = pair;
    g.qaChoices = shuffle([pair.a, ...distractors]);
    g.qaDone = false;
    g.qaLocked = false;
    g.qaMistake = false;
  } else if(item.subKind === 'order'){
    const sentence = item.data;
    const tokens = sentence.split(' ');
    g.current = sentence;
    g.originalWords = tokens;
    g.sentenceTokens = shuffle(tokens.map((t,i)=>({text:t, idx:i})));
    g.placedTokens = [];
    g.sentenceMistake = false;
    g.sentenceDone = false;
    g.sentenceLocked = false;
  } else {
    const current = item.data;
    const distractors = shuffle(g.sentencePool.filter(s=>s!==current)).slice(0,3);
    g.current = current;
    g.sentenceChoices = shuffle([current, ...distractors]);
    g.sentenceChoiceDone = false;
    g.sentenceChoiceLocked = false;
    g.sentenceChoiceMistake = false;
  }
}
function advanceQuestion(){
  const g = state.game;
  if(g.qIndex < g.order.length-1){
    g.qIndex += 1; setupQuestion(); render(); speakCurrentQuestion();
  } else {
    state.screen='gameEnd'; render(); confettiBurst();
  }
}
function handleAnswer(btnEl, en, kind){
  const g = state.game;
  const doneKey = kind==='word' ? 'wordDone' : 'pictureDone';
  const lockKey = kind==='word' ? 'wordLocked' : 'pictureLocked';
  const mistakeKey = kind==='word' ? 'wordMistake' : 'pictureMistake';
  if(g[doneKey] || g[lockKey]) return;
  if(en === g.current.en){
    g[lockKey] = true;
    btnEl.classList.add('correct');
    if(!g[mistakeKey]){
      markMastered(state.lessonIdx, kind, g.current.en);
      g.sessionStars += 1;
      const badge = document.querySelector('.score-badge');
      if(badge) badge.textContent = '⭐ ' + g.sessionStars;
    }
    setTimeout(()=>{
      g[doneKey] = true;
      if(g.wordDone && g.pictureDone) advanceQuestion();
      else render();
    }, 600);
  } else {
    g[mistakeKey] = true;
    btnEl.classList.add('wrong');
    setTimeout(()=>{ btnEl.classList.remove('wrong'); }, 500);
  }
}
function handleSentenceTap(btnEl, idx){
  const g = state.game;
  if(g.sentenceDone || g.sentenceLocked) return;
  const expectedIdx = g.placedTokens.length;
  const expectedWord = g.originalWords[expectedIdx];
  const tapped = g.sentenceTokens.find(t=>t.idx===idx);
  if(tapped && tapped.text === expectedWord){
    g.sentenceLocked = true;
    btnEl.classList.add('correct');
    setTimeout(()=>{
      const token = tapped;
      g.placedTokens.push(token);
      g.sentenceTokens = g.sentenceTokens.filter(t=>t.idx!==idx);
      g.sentenceLocked = false;
      if(g.sentenceTokens.length === 0){
        g.sentenceDone = true;
        if(!g.sentenceMistake){
          markMastered(state.lessonIdx, 'sentence', g.current);
          g.sessionStars += 1;
          const badge = document.querySelector('.score-badge');
          if(badge) badge.textContent = '⭐ ' + g.sessionStars;
        }
        render();
        setTimeout(()=>advanceQuestion(), 700);
      } else {
        render();
      }
    }, 300);
  } else {
    g.sentenceMistake = true;
    btnEl.classList.add('wrong');
    setTimeout(()=>{ btnEl.classList.remove('wrong'); }, 500);
  }
}
function handleSentenceChoiceTap(btnEl, idx){
  const g = state.game;
  if(g.sentenceChoiceDone || g.sentenceChoiceLocked) return;
  const text = g.sentenceChoices[idx];
  if(text === g.current){
    g.sentenceChoiceLocked = true;
    btnEl.classList.add('correct');
    if(!g.sentenceChoiceMistake){
      markMastered(state.lessonIdx, 'sentence', g.current);
      g.sessionStars += 1;
      const badge = document.querySelector('.score-badge');
      if(badge) badge.textContent = '⭐ ' + g.sessionStars;
    }
    setTimeout(()=>{
      g.sentenceChoiceDone = true;
      advanceQuestion();
    }, 600);
  } else {
    g.sentenceChoiceMistake = true;
    btnEl.classList.add('wrong');
    setTimeout(()=>{ btnEl.classList.remove('wrong'); }, 500);
  }
}
function handleQATap(btnEl, idx){
  const g = state.game;
  if(g.qaDone || g.qaLocked) return;
  const text = g.qaChoices[idx];
  if(text === g.current.a){
    g.qaLocked = true;
    btnEl.classList.add('correct');
    if(!g.qaMistake){
      markMastered(state.lessonIdx, 'qa', g.current.q);
      g.sessionStars += 1;
      const badge = document.querySelector('.score-badge');
      if(badge) badge.textContent = '⭐ ' + g.sessionStars;
    }
    setTimeout(()=>{
      g.qaDone = true;
      advanceQuestion();
    }, 600);
  } else {
    g.qaMistake = true;
    btnEl.classList.add('wrong');
    setTimeout(()=>{ btnEl.classList.remove('wrong'); }, 500);
  }
}

/* ---------- 畫面渲染 ---------- */
function render(){
  const app = document.getElementById('app');
  if(state.screen==='home') app.innerHTML = renderHome();
  else if(state.screen==='lesson') app.innerHTML = renderLesson();
  else if(state.screen==='reviewMenu') app.innerHTML = renderReviewMenu();
  else if(state.screen==='gameDays') app.innerHTML = renderGameDayPicker();
  else if(state.screen==='review') app.innerHTML = renderReview();
  else if(state.screen==='reviewEnd') app.innerHTML = renderReviewEnd();
  else if(state.screen==='game') app.innerHTML = renderGame();
  else if(state.screen==='gameEnd') app.innerHTML = renderGameEnd();
  bindEvents();
  if(state.screen==='review'){
    const item = state.items[state.pos];
    setTimeout(()=>speak(item.en, item.type==='sentence' ? SENTENCE_RATE : WORD_RATE), 300);
  }
}

function renderHome(){
  let cards = LESSONS.map((l,i)=>`
    <button class="card-btn ${l.color}" data-action="lesson" data-idx="${i}">
      <span class="emoji">${l.emoji}</span>
      <span>${l.title}</span>
      <span class="lesson-stars">⭐ ${getLessonStars(i)} / ${getLessonMaxStars(i)}</span>
    </button>
  `).join('');
  return `
    <div class="screen">
      <h1>🌈 Osmond 英文單字遊戲</h1>
      <div class="stars-total">⭐ 累積總星星：${getTotalStars()} / ${getTotalMaxStars()}</div>
      <h2>選一課開始玩吧！</h2>
      <div class="grid">${cards}</div>
    </div>
  `;
}

function renderLesson(){
  const lesson = LESSONS[state.lessonIdx];
  return `
    <div class="screen">
      <button class="back-btn" data-action="home">⬅️ 回首頁</button>
      <h1>${lesson.emoji} ${lesson.title}</h1>
      <div class="lesson-stars" style="font-size:1.1rem; margin-bottom:16px;">⭐ 本課星星：${getLessonStars(state.lessonIdx)} / ${getLessonMaxStars(state.lessonIdx)}</div>
      <h2>想先複習，還是直接玩遊戲？</h2>
      <div class="grid">
        <button class="card-btn l0" data-action="review-menu">
          <span class="emoji">📖</span>
          <span>先複習</span>
        </button>
        <button class="card-btn l4" data-action="game-days">
          <span class="emoji">🎮</span>
          <span>直接玩遊戲</span>
        </button>
      </div>
    </div>
  `;
}

function renderReviewMenu(){
  const lesson = LESSONS[state.lessonIdx];
  const dayNames = {A:"星期一",B:"星期二",C:"星期三",D:"星期四",E:"複習日"};
  let btns = [...DAY_KEYS,"E"].map(k=>`
    <button class="card-btn day${k}" data-action="review" data-key="${k}">
      <span class="emoji">${DAY_ICON[k]}</span>
      <span>${dayNames[k]}${k==='E'?' 全週複習':''}</span>
    </button>
  `).join('');
  return `
    <div class="screen">
      <button class="back-btn" data-action="lesson-back">⬅️ 回課程選單</button>
      <h1>${lesson.emoji} ${lesson.title}</h1>
      <h2>📖 選一天來聽發音、複習單字和句子</h2>
      <div class="grid">${btns}</div>
    </div>
  `;
}

function renderGameDayPicker(){
  const lesson = LESSONS[state.lessonIdx];
  const dayNames = {A:"星期一",B:"星期二",C:"星期三",D:"星期四"};
  let btns = DAY_KEYS.map(k=>`
    <button class="card-btn day${k}" data-action="start-game" data-day="${k}">
      <span class="emoji">${DAY_ICON[k]}</span>
      <span>${dayNames[k]}</span>
    </button>
  `).join('');
  btns += `
    <button class="card-btn dayE" data-action="start-game" data-day="ALL">
      <span class="emoji">⭐</span>
      <span>全部（週一~週四）</span>
    </button>
  `;
  return `
    <div class="screen">
      <button class="back-btn" data-action="lesson-back">⬅️ 回課程選單</button>
      <h1>${lesson.emoji} ${lesson.title}</h1>
      <h2>🎮 聽力遊戲：要考單日還是全部？</h2>
      <div class="grid">${btns}</div>
    </div>
  `;
}

function renderReview(){
  const item = state.items[state.pos];
  let dots = state.items.map((it,i)=>{
    let cls='dot'+(i<state.pos?' done':'')+(i===state.pos?' current':'');
    return `<div class="${cls}"></div>`;
  }).join('');

  let cardInner;
  if(item.type==='word'){
    cardInner = `
      ${iconHTML(item, 'emoji-big')}
      <div class="tag">單字 Word</div>
      <div class="word-en">${item.en}</div>
      <div class="word-zh">${item.zh}</div>
    `;
  } else {
    cardInner = `
      <div class="emoji-big">💬</div>
      <div class="tag">句子 Sentence</div>
      <div class="sentence-en">${item.en}</div>
    `;
  }

  return `
    <div class="screen">
      <button class="back-btn" data-action="lesson-back">⬅️ 回課程選單</button>
      <div class="progress">${dots}</div>
      <div class="practice-wrap">
        <div class="flashcard">${cardInner}</div>
        <div class="btn-row">
          <button class="round-btn prev-btn" data-action="prev" ${state.pos===0?'disabled style="opacity:.3"':''}>⬅️</button>
          <button class="round-btn speak-btn" data-action="speak">🔊</button>
          <button class="round-btn next-btn" data-action="next">➡️</button>
        </div>
        <div class="hint">聽發音，跟著大聲唸出來，按➡️看下一張</div>
      </div>
    </div>
  `;
}

function renderReviewEnd(){
  return `
    <div class="screen">
      <div class="end-wrap">
        <div class="end-stars">📖✨📖</div>
        <h1>複習完成！</h1>
        <h2>要不要玩聽力遊戲賺星星呢？</h2>
        <div>
          <button class="big-btn" style="background:var(--purple)" data-action="game-from-review">🎮 玩遊戲</button>
          <button class="big-btn" style="background:var(--green)" data-action="replay-review">🔁 再複習一次</button>
          <button class="big-btn" style="background:var(--blue)" data-action="lesson-back">📚 選別的星期</button>
          <button class="big-btn" style="background:var(--pink)" data-action="home">🏠 回首頁</button>
        </div>
      </div>
    </div>
  `;
}

function renderWordQuestion(g){
  function choiceButtons(choices, kind, done){
    return choices.map(c=>{
      const isCorrect = c.en === g.current.en;
      let cls = 'choice-btn ' + (kind==='word' ? 'text-only' : 'icon-only');
      if(done) cls += isCorrect ? ' correct' : ' disabled-choice';
      const inner = kind==='word' ? `<span>${c.en}</span>` : iconHTML(c, 'game-emoji');
      const attrs = done ? '' : `data-action="answer" data-en="${c.en}" data-kind="${kind}"`;
      return `<button class="${cls}" ${attrs}>${inner}</button>`;
    }).join('');
  }
  return `
    <h2>🎧 聽聽看，選出正確的單字卡和圖片卡！</h2>
    <button class="big-speaker" data-action="speak-current">🔊</button>
    <div class="game-section">
      <div class="section-label">${g.wordDone?'✅ ':''}選單字</div>
      <div class="choice-grid">${choiceButtons(g.wordChoices, 'word', g.wordDone)}</div>
    </div>
    <div class="game-section">
      <div class="section-label">${g.pictureDone?'✅ ':''}選圖片</div>
      <div class="choice-grid">${choiceButtons(g.pictureChoices, 'picture', g.pictureDone)}</div>
    </div>
    <div class="hint">先聽聲音，兩邊都選對才會進下一題</div>
  `;
}

function renderSentenceOrderQuestion(g){
  const placedHTML = g.placedTokens.map(t=>`<span class="placed-token">${t.text}</span>`).join('');
  const bankHTML = g.sentenceTokens.map(t=>`
    <button class="choice-btn sentence-tile" data-action="sentence-tap" data-idx="${t.idx}">${t.text}</button>
  `).join('');
  return `
    <h2>🗣️ 聽聽看，把單字依序排成句子！</h2>
    <button class="big-speaker" data-action="speak-current">🔊</button>
    <div class="sentence-build-row">${placedHTML || '<span class="build-placeholder">…</span>'}</div>
    <div class="tile-bank">${bankHTML}</div>
    <div class="hint">先聽聲音，依照順序點選單字排成句子</div>
  `;
}

function renderSentenceChoiceQuestion(g){
  let choices = g.sentenceChoices.map((c,i)=>{
    const isCorrect = c === g.current;
    let cls = 'choice-btn sentence-choice';
    if(g.sentenceChoiceDone) cls += isCorrect ? ' correct' : ' disabled-choice';
    const attrs = g.sentenceChoiceDone ? '' : `data-action="sentence-choice-tap" data-idx="${i}"`;
    return `<button class="${cls}" ${attrs}><span>${c}</span></button>`;
  }).join('');
  return `
    <h2>🗣️ 聽聽看，選出正確的句子！</h2>
    <button class="big-speaker" data-action="speak-current">🔊</button>
    <div class="sentence-choice-list">${choices}</div>
    <div class="hint">先聽聲音，再選出對應的句子卡</div>
  `;
}

function renderQAQuestion(g){
  let choices = g.qaChoices.map((c,i)=>{
    const isCorrect = c === g.current.a;
    let cls = 'choice-btn sentence-choice';
    if(g.qaDone) cls += isCorrect ? ' correct' : ' disabled-choice';
    const attrs = g.qaDone ? '' : `data-action="qa-tap" data-idx="${i}"`;
    return `<button class="${cls}" ${attrs}><span>${c}</span></button>`;
  }).join('');
  return `
    <h2>💬 看看問題，選出正確的回答！</h2>
    <button class="big-speaker" data-action="speak-current">🔊</button>
    <div class="qa-question-box">${g.current.q}</div>
    <div class="sentence-choice-list">${choices}</div>
    <div class="hint">先讀讀看/聽聽看問題，再選出正確的回答</div>
  `;
}

function renderGame(){
  const g = state.game;
  const item = g.order[g.qIndex];
  let dots = g.order.map((it,i)=>{
    let cls='dot'+(i<g.qIndex?' done':'')+(i===g.qIndex?' current':'');
    return `<div class="${cls}"></div>`;
  }).join('');
  let body;
  if(item.kind==='word') body = renderWordQuestion(g);
  else if(item.kind==='qa') body = renderQAQuestion(g);
  else if(item.subKind==='order') body = renderSentenceOrderQuestion(g);
  else body = renderSentenceChoiceQuestion(g);

  return `
    <div class="screen">
      <button class="back-btn" data-action="lesson-back">⬅️ 回課程選單</button>
      <div class="score-badge">⭐ ${g.sessionStars}</div>
      <div class="progress">${dots}</div>
      <div class="practice-wrap">
        <div class="tag">${GAME_SCOPE_LABEL[g.dayKey]}</div>
        ${body}
      </div>
    </div>
  `;
}

function renderGameEnd(){
  const g = state.game;
  return `
    <div class="screen">
      <div class="end-wrap">
        <div class="end-stars">🌟🎉🌟</div>
        <h1>遊戲結束！</h1>
        <h2>完成了 ${g.order.length} 題（單字＋句子＋問答），獲得 ${g.sessionStars} 顆星星！</h2>
        <div class="stars-total">⭐ 本課星星：${getLessonStars(state.lessonIdx)} / ${getLessonMaxStars(state.lessonIdx)}　|　全部累積：${getTotalStars()} / ${getTotalMaxStars()}</div>
        <div>
          <button class="big-btn" style="background:var(--purple)" data-action="game">🔁 再玩一次</button>
          <button class="big-btn" style="background:var(--blue)" data-action="lesson-back">📚 回課程選單</button>
          <button class="big-btn" style="background:var(--pink)" data-action="home">🏠 回首頁</button>
        </div>
      </div>
    </div>
  `;
}

function bindEvents(){
  document.querySelectorAll('[data-action]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const action = el.dataset.action;
      if(action==='lesson') goLesson(parseInt(el.dataset.idx,10));
      else if(action==='review-menu') goReviewMenu();
      else if(action==='game-days') goGameDays();
      else if(action==='review') goReview(el.dataset.key);
      else if(action==='replay-review') goReview(state.dayKey);
      else if(action==='home') goHome();
      else if(action==='lesson-back') goLesson(state.lessonIdx);
      else if(action==='next') nextReview();
      else if(action==='prev') prevReview();
      else if(action==='speak'){ const item = state.items[state.pos]; speak(item.en, item.type==='sentence' ? SENTENCE_RATE : WORD_RATE); }
      else if(action==='start-game') goGame(el.dataset.day);
      else if(action==='game-from-review') goGame(state.dayKey==='E' ? 'ALL' : state.dayKey);
      else if(action==='game') goGame(state.game ? state.game.dayKey : 'ALL');
      else if(action==='speak-current'){
        const item = state.game.order[state.game.qIndex];
        if(item.kind==='word') speak(item.data.en, WORD_RATE);
        else if(item.kind==='qa') speak(item.data.q, SENTENCE_RATE);
        else speak(item.data, SENTENCE_RATE);
      }
      else if(action==='answer') handleAnswer(el, el.dataset.en, el.dataset.kind);
      else if(action==='sentence-tap') handleSentenceTap(el, parseInt(el.dataset.idx,10));
      else if(action==='sentence-choice-tap') handleSentenceChoiceTap(el, parseInt(el.dataset.idx,10));
      else if(action==='qa-tap') handleQATap(el, parseInt(el.dataset.idx,10));
    });
  });
}

render();
</script>
